# SPA router support.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# api redirect.
[[redirects]]
  from = "/proxy/*"
  to = "https://dapi.kakao.com/:splat"
  status = 200
  force = true
  headers = { Access-Control-Allow-Origin = “*”, Authorization = “Bearer api-key”}

[[headers]]
Define which paths this specific [[headers]] block will cover.
for = “/*”
[headers.values]
Access-Control-Allow-Origin = “**”
Authorization = “Bearer api-key”

[[headers]]
Define which paths this specific [[headers]] block will cover.
for = “/api/*”
[headers.values]
Access-Control-Allow-Origin = “**”
Authorization = “Bearer api-key”