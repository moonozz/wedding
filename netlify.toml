# SPA router support.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# api redirect.
[[redirects]]
  from = "/api/*"
  to = "https://dapi.kakao.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/*"
  to = "https://weddingmoon.netlify.app/:splat"
  status = 200
  force = true